[package]
name = "tijarapos"
version = "0.1.0"
description = "TijaraPOS offline-first desktop POS application"
authors = ["TijaraPOS"]
license = "UNLICENSED"
repository = "https://github.com/IbraDev33/TijaraPOS"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rust-embed = "8.11.0"
thiserror = "2.0.20"
